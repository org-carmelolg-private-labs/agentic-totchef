name: Coverage Badge

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov coverage-badge  pkg_resources


      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=lib --cov-report=term-missing

      - name: Generate coverage badge
        run: |
          coverage-badge -f -o static/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add static/coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip actions]"
          git push
